services:
  postgres:
    image: postgres:17
    container_name: doc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_pg_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-doc_metadata}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql
    networks:
      - doc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docapp} -d ${POSTGRES_DB:-doc_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: doc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - doc_network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc
    container_name: doc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-company-docs};
      echo 'MinIO bucket ${MINIO_BUCKET:-company-docs} ready';
      "
    networks:
      - doc_network

  mailpit:
    image: axllent/mailpit
    container_name: doc_mailpit
    restart: unless-stopped
    environment:
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
    ports:
      - "11025:1025"
      - "18025:8025"
    networks:
      - doc_network

  redis:
    image: redis:7.4-alpine
    container_name: doc_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret_redis_pwd} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doc_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-secret_redis_pwd} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: camis_app
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_pg_pwd}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-doc_metadata}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_redis_pwd}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:5173}
      PLAYWRIGHT_SVC_URL: ${PLAYWRIGHT_SVC_URL:-http://playwright-svc:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      playwright-svc:
        condition: service_started
    networks:
      - doc_network

  playwright-svc:
    build: ./playwright-svc
    container_name: doc_playwright
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://host.docker.internal:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - doc_network

volumes:
  pg_data:
  minio_data:
  redis_data:

networks:
  doc_network:
    driver: bridge
