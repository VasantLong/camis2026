name: Mirror to Aliyun Codeup

on:
  push:
    branches: [ "**" ]
    tags: [ "*" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: |
          git config --global user.name "github-mirror"
          git config --global user.email "mirror@github-actions"

      - name: Push to Aliyun Codeup
        env:
          TARGET_URL: ${{ secrets.ALIYUN_MIRROR_URL }}
          TOKEN: ${{ secrets.ALIYUN_CODEPUP_TOKEN }}
        run: |
          AUTH_URL="https://private:${TOKEN}@${TARGET_URL#https://}"
          git remote add aliyun "$AUTH_URL"
          git push aliyun --all --force
          git push aliyun --tags --force
          git remote remove aliyun
